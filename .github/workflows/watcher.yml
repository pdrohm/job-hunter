name: Job watcher

# Runs the scraper on GitHub's servers and sends new jobs to Telegram.
# Secrets:   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Variables (optional, Settings → Secrets and variables → Actions → Variables):
#   WATCH_CONTRACT_ONLY, WATCH_ALLOW_SPONSORSHIP, WATCH_MIN_SCORE, WATCH_TECHS,
#   WATCH_LOCATIONS, WATCH_TIME_RANGE, WATCH_ENGINES, WATCH_MAX_PER_RUN

on:
  schedule:
    - cron: "17 */2 * * *" # every 2 hours (off the hour: less queueing on GitHub)
  workflow_dispatch:

# Never run two at once: they would both send the same new jobs
concurrency:
  group: job-watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # seen_jobs.json remembers what was already sent. Each run saves a new
      # cache entry; restore-keys picks the most recent one.
      - name: Restore seen jobs
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: data/seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: seen-jobs-

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_DIR: data
          WATCH_CONTRACT_ONLY: ${{ vars.WATCH_CONTRACT_ONLY }}
          WATCH_ALLOW_SPONSORSHIP: ${{ vars.WATCH_ALLOW_SPONSORSHIP }}
          WATCH_MIN_SCORE: ${{ vars.WATCH_MIN_SCORE }}
          WATCH_TECHS: ${{ vars.WATCH_TECHS }}
          WATCH_LOCATIONS: ${{ vars.WATCH_LOCATIONS }}
          WATCH_EXCLUDE_COUNTRIES: ${{ vars.WATCH_EXCLUDE_COUNTRIES }}
          WATCH_TIME_RANGE: ${{ vars.WATCH_TIME_RANGE }}
          WATCH_ENGINES: ${{ vars.WATCH_ENGINES }}
          WATCH_MAX_PER_RUN: ${{ vars.WATCH_MAX_PER_RUN }}
          SEEN_CACHE_KEY: ${{ steps.seen.outputs.cache-matched-key }}
        run: |
          if [ -z "$SEEN_CACHE_KEY" ]; then
            echo "No seen-jobs history yet: seeding without sending"
            python watcher.py --seed
          else
            python watcher.py --once
          fi

      - name: Save seen jobs
        if: always() && hashFiles('data/seen_jobs.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
